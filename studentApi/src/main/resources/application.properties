spring.application.name=studentApi

# Basic Connection
# TODO: Move these values out of source control.
# Use environment variables or a secrets manager (e.g. Vault, AWS Secrets Manager).
# Example: spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialect (Tells Hibernate how to write Postgres-specific SQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

# TODO: Use a cryptographically random Base64-encoded secret of at least 256 bits.
# Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:replace-me-with-a-secure-256bit-base64-encoded-secret}
